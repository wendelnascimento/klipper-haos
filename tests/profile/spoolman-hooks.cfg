# Test-only stand-ins for the app's Spoolman hooks (generated.cfg). They
# count their calls and record the extruder position at the time of the
# call, so the G-code file can check when the filament macros call them.
[gcode_macro _KHAOS_SPOOLMAN_EJECT]
variable_count: 0
variable_e: -999
gcode:
    SET_GCODE_VARIABLE MACRO=_KHAOS_SPOOLMAN_EJECT VARIABLE=count VALUE={printer["gcode_macro _KHAOS_SPOOLMAN_EJECT"].count + 1}
    SET_GCODE_VARIABLE MACRO=_KHAOS_SPOOLMAN_EJECT VARIABLE=e VALUE={printer.toolhead.position.e}

[gcode_macro _KHAOS_SPOOLMAN_SELECT]
variable_count: 0
variable_e: -999
gcode:
    SET_GCODE_VARIABLE MACRO=_KHAOS_SPOOLMAN_SELECT VARIABLE=count VALUE={printer["gcode_macro _KHAOS_SPOOLMAN_SELECT"].count + 1}
    SET_GCODE_VARIABLE MACRO=_KHAOS_SPOOLMAN_SELECT VARIABLE=e VALUE={printer.toolhead.position.e}

[gcode_macro _TEST_ASSERT_HOOK]
gcode:
    {% set m = printer["gcode_macro _KHAOS_SPOOLMAN_" ~ params.NAME] %}
    {% if m.count != params.COUNT|int %}
        {action_raise_error('assert: %s called %d times, expected %s' % (params.NAME, m.count, params.COUNT))}
    {% endif %}
    {% if params.E is defined and (m.e - params.E|float)|abs > 0.01 %}
        {action_raise_error('assert: %s called at e=%.2f, expected %s' % (params.NAME, m.e, params.E))}
    {% endif %}
