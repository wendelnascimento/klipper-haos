# Simulates the Home Assistant Supervisor ingress proxy for tests.
# It runs at 172.30.32.2 (the real Supervisor address), strips the
# /api/hassio_ingress/<token> prefix and sets X-Ingress-Path and
# X-Forwarded-Host (the host the browser used), like Home Assistant does.
# The Host header that reaches the app (khaos-app:8099) differs from the
# browser's, as it can behind the real proxy chain.
server {
    listen 80;
    client_max_body_size 0;

    location /api/hassio_ingress/testtoken/ {
        proxy_pass http://khaos-app:8099/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Ingress-Path /api/hassio_ingress/testtoken;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }
}
