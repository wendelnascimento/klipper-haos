# Shared locations for the ingress and direct servers.
# Expects $khaos_base to be set to the URL prefix the browser sees
# ("" on the direct port, "/api/hassio_ingress/<token>" via ingress).

root /opt/mainsail;
index index.html;

# Moonraker must see the real client address, never a client-supplied one.
# SECURITY: nginx only inherits proxy_set_header into a location that sets
# none of its own. Keep ALL proxy_set_header directives here, never inside
# a location block, or the forced X-Real-IP below would be lost there.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $khaos_upstream_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_http_version 1.1;

# Large G-code uploads: no size limit, no temp files, stream to Moonraker.
client_max_body_size 0;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;

# Mainsail is built with the placeholder base "/__KHAOS_BASE__".
sub_filter_once off;
sub_filter_types application/javascript text/css application/manifest+json;
sub_filter "/__KHAOS_BASE__" $khaos_base;

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

location /assets/ {
    # Hashed file names: safe to cache for a long time.
    add_header Cache-Control "public, max-age=604800, immutable";
}

location = /config.json {
    add_header Cache-Control "no-cache";
}

location = /websocket {
    proxy_pass http://moonraker/websocket;
    proxy_read_timeout 1d;
}

location ~ ^/(printer|api|access|machine|server)/ {
    proxy_pass http://moonraker$request_uri;
}
