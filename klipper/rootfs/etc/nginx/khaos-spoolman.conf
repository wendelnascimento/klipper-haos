# Spoolman web UI, on the ingress server only (see nginx.conf).
#
# Spoolman has no login of its own. Behind ingress every request was already
# authenticated by Home Assistant; the direct port does not serve it at all.
# Spoolman runs with SPOOLMAN_BASE_PATH=/spoolman, so the path is passed on
# unchanged. Moonraker talks to 127.0.0.1:7912 directly, not through here.

location = /spoolman {
    return 302 $khaos_base/spoolman/;
}

location ^~ /spoolman/ {
    # Spoolman refuses writes whose Origin is not its own host. Unlike for
    # Moonraker, do not present the Origin as Host here: pass the Host that
    # arrived, plus X-Forwarded-Host, which Home Assistant Core sets to the
    # host the browser used and the Supervisor passes on. Spoolman accepts
    # either. Only the Supervisor can connect to this server, so neither
    # header comes straight from the browser.
    set $khaos_upstream_host $http_host;
    set $khaos_forwarded_host $http_x_forwarded_host;

    proxy_pass http://spoolman;
    proxy_read_timeout 1d;

    # Spoolman's own redirects point at /spoolman/...; keep the browser
    # inside the ingress path.
    proxy_redirect ~^(?:https?://[^/]+)?/spoolman/(.*)$ $khaos_base/spoolman/$1;

    # The prerendered pages use relative paths and work under any prefix.
    # The SPA fallback document (deep links such as /spoolman/spool/show/3)
    # is rewritten by Spoolman with absolute /spoolman/ paths, which must get
    # the ingress prefix too. Needs an uncompressed upstream response, see
    # Accept-Encoding in khaos-locations.conf.
    # text/html is always filtered; this only replaces the JS/CSS/manifest
    # types inherited from khaos-locations.conf, which Spoolman does not need.
    sub_filter_types text/x-khaos-none;
    sub_filter '"/spoolman/' '"$khaos_base/spoolman/';
    sub_filter 'base: "/spoolman"' 'base: "$khaos_base/spoolman"';

    error_page 502 504 = @spoolman_down;
}

location @spoolman_down {
    default_type text/plain;
    return 503 "Spoolman is not running. Turn on the 'spoolman' option in the Klipper app's Configuration tab and restart the app. If it is on, check the app log.\n";
}
