# nginx for the Klipper HAOS app. Single worker: this serves one browser
# session and a slicer at a time on low-power hardware.
daemon off;
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Temporary files in tmpfs, never on the data disk.
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    upstream moonraker {
        server 127.0.0.1:7126;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Home Assistant passes the ingress path prefix in X-Ingress-Path. Only
    # accept the expected shape so nothing else can be injected into pages.
    map $http_x_ingress_path $khaos_ingress_base {
        "~^/api/hassio_ingress/[A-Za-z0-9_-]+$" $http_x_ingress_path;
        default "";
    }

    # Host of the browser's Origin header (scheme stripped).
    map $http_origin $khaos_origin_host {
        "~^https?://(?<origin_host>[^/]+)$" $origin_host;
        default $http_host;
    }

    # ---------------------------------------------------------------------
    # Ingress (Home Assistant sidebar)
    # ---------------------------------------------------------------------
    server {
        listen 8099 default_server;

        # Only the Supervisor ingress proxy may connect.
        allow 172.30.32.2;
        deny all;

        set $khaos_base $khaos_ingress_base;
        # Moonraker rejects WebSockets whose Origin does not match Host. Behind
        # the Home Assistant -> Supervisor proxy chain the Host header no
        # longer reliably matches what the browser used, so present the
        # Origin's host. This only relaxes Moonraker's same-origin check on
        # this port, which is reachable solely through Home Assistant ingress
        # (authenticated HA session). The direct port keeps the full check.
        set $khaos_upstream_host $khaos_origin_host;
        include /etc/nginx/khaos-locations.conf;
    }

    # ---------------------------------------------------------------------
    # Direct access (slicers, external clients). The container port is only
    # published on the host if the user enables it in the Network section.
    # Moonraker requires an API key here unless the client's address is in
    # the app option 'trusted_networks'.
    # ---------------------------------------------------------------------
    server {
        listen 7125 default_server;

        set $khaos_base "";
        set $khaos_upstream_host $http_host;
        include /etc/nginx/khaos-locations.conf;
    }
}
