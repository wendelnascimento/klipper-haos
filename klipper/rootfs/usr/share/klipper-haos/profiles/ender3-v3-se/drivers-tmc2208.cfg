# =============================================================================
# Ender 3 V3 SE - stepper driver UART configuration (TMC2208 mode)
# =============================================================================
# VERIFY your board's driver chips before using this file. Some V3 SE boards
# are reported to use TMC2208-compatible drivers, others MS35774 chips.
#
# If Klipper reports "Unable to read tmc uart 'stepper_x' register IFCNT"
# the drivers do not answer in this mode: comment out the
# "[include drivers-tmc2208.cfg]" line in printer.cfg (the drivers then run
# with their hardware default current) and report your board revision in a
# GitHub issue so the profile can be improved.
#
# The extruder driver is not UART-controlled on this board.
# =============================================================================

[tmc2208 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[tmc2208 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
interpolate: True

[tmc2208 stepper_z]
uart_pin: PB14
run_current: 0.80
sense_resistor: 0.150
interpolate: True
