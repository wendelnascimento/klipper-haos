# =============================================================================
# Ender 3 V3 SE - accelerometer for input shaper calibration (optional)
# =============================================================================
# STATUS: EXPERIMENTAL - NOT YET VALIDATED ON HARDWARE BY THIS PROJECT.
#
# For a Mellow FLY ADXL345 USB board (RP2040 + ADXL345, USB-C) running
# Klipper firmware, connected to the Home Assistant host by USB. The host
# has no SPI pins of its own, so the accelerometer needs its own small MCU.
# Pins are from Mellow's documentation for that board.
#
# Use (full guide: docs/input-shaper-calibration.md in the project):
#   1. Flash the board with Klipper (firmware/fly-adxl345-usb/klipper.config).
#   2. App options: 'numpy' on, 'adxl_serial_device' = the board's
#      /dev/serial/by-id/usb-Klipper_rp2040_... entry. Restart the app.
#   3. In /config/printer.cfg, after the profile include:
#        [include profiles/ender3-v3-se/adxl.cfg]
#   4. ACCELEROMETER_QUERY, then SHAPER_CALIBRATE AXIS=X (board on the
#      toolhead) and SHAPER_CALIBRATE AXIS=Y (board on the bed), SAVE_CONFIG
#      after each.
#   5. Afterwards remove the include line and clear 'adxl_serial_device':
#      Klipper waits at start-up for every configured MCU, so it would not
#      become ready with the board unplugged.
#
# The results go to [input_shaper] in /config/printer.cfg (SAVE_CONFIG block);
# the profile itself sets only shaper_type there.
# =============================================================================

[mcu adxl]
# The serial port comes from the app option 'adxl_serial_device'
# (klipper-haos/generated.cfg). Without it Klipper reports that 'serial' in
# section 'mcu adxl' must be specified.

[adxl345]
# Mellow FLY ADXL345 USB: software SPI on the RP2040.
cs_pin: adxl:gpio9
spi_software_sclk_pin: adxl:gpio10
spi_software_mosi_pin: adxl:gpio11
spi_software_miso_pin: adxl:gpio12
# Chip axes -> printer axes. SHAPER_CALIBRATE fits the shaper to the sum of
# all three chip axes, so its result does not depend on this; it only names
# the psd_x/psd_y/psd_z columns in the CSV files. Set it to match how the
# board is mounted if you graph those (see docs/input-shaper-calibration.md).
axes_map: x, y, z

[resonance_tester]
accel_chip: adxl345
# Nozzle position for the test: the bed centre. The four bed screws
# (screws_tilt_adjust, probe positions) are centred on about X 116.5,
# Y 116, so 117, 117. Well inside the axis limits (X -6..230,
# Y -14..230), with room for the small test moves.
probe_points:
    117, 117, 20
# Klipper's defaults otherwise (accel_per_hz 60, 5-135 Hz, 1 Hz/s). The test
# sets its own acceleration and restores [printer] max_accel afterwards.
# If the vibrations get violent, lower accel_per_hz here (for example 50)
# and stop the test with M112 if needed.
