# =============================================================================
# Creality Ender 3 V3 SE - original display (EXPERIMENTAL, OPTIONAL)
# =============================================================================
# STATUS: NOT YET VALIDATED ON HARDWARE BY THIS PROJECT.
#
# Shows a Klipper menu on the printer's own screen and knob. The code comes
# from the "ender3-v3-se-klipper-with-display" project by jpcurti and is
# bundled in the app (inactive until this file is included).
#
# Requirements, all three are needed:
#   1. The "ender3-v3-se-display" MCU firmware from this project's release
#      (adds a serial bridge to the display port). The normal
#      "ender3-v3-se" firmware does NOT work with this file: Klipper will
#      stop with an error about the serial bridge.
#   2. Display firmware 1.0.6 on the screen itself (Creality firmware). Other
#      versions may keep icons at other positions and show wrong graphics.
#      If the icons look right, the screen is compatible.
#   3. The stock display cable, connected as delivered. No wiring changes.
#
# To enable: add this line to /config/printer.cfg, BELOW the profile
# include:
#     [include profiles/ender3-v3-se/display.cfg]
# Remove the line (and restart Klipper) to turn the display off again.
#
# Known limits (from the upstream project): "Set max speed", "Set max
# acceleration" and "Set steps per-mm" are not supported, and some menu
# actions may still be unstable. Prints started from the screen run the
# same START_PRINT macro (and its safety gate) as prints started elsewhere.
# =============================================================================

[e3v3se_display]
# Menu language: english, german, french, spanish, italian, portuguese,
# russian, turkish, chinese, japanese, korean.
language: english
# Extra messages in klippy.log (useful when reporting problems).
logging: False
# The values below are the stock wiring and the module defaults. They are
# listed for reference; change them only for a modified printer.
#   Display serial: USART2 (bridge config 3), TX PA2, RX PA3, 115200 baud
#tx_pin: PA2
#rx_pin: PA3
#baud: 115200
#config: 3
#   Knob: encoder on PA12/PA11, push button on PB1
#encoder_pins: ^PA12, ^PA11
#click_pin: ^!PB1

# Entries in the display's "Macros" menu (Miscellaneous). The menu lists
# only [e3v3se_display MACRO<n>] sections; without them it shows "No
# macros". The commands come from filament.cfg. Icon 14 is the default;
# run ENDER_SE_DISPLAY_ICON_FINDER to browse the other icon numbers.
[e3v3se_display MACRO1]
label: Load filament
gcode: LOAD_FILAMENT
icon: 14

[e3v3se_display MACRO2]
label: Unload filament
gcode: UNLOAD_FILAMENT
icon: 14

[e3v3se_display MACRO3]
label: Purge nozzle
gcode: PURGE
icon: 14

# Add your own the same way, for example:
#[e3v3se_display MACRO4]
#label: Home all axes
#gcode: G28
#icon: 14
