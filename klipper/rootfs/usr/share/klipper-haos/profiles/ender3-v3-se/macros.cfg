# =============================================================================
# Ender 3 V3 SE - print macros (Klipper HAOS profile)
# =============================================================================
# Slicer start G-code:  START_PRINT BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer]
# Slicer end G-code:    END_PRINT
# (OrcaSlicer placeholders shown; other slicers use different names.)
#
# SAFETY GATE: START_PRINT refuses to run until you have worked through the
# hardware validation checklist (docs/printer-setup.md) and confirmed it with
#     MARK_HARDWARE_VALIDATED CONFIRM=YES
# This protects against printing with an unverified profile. It does not
# block manual commands or G-code files that do not call START_PRINT.
# =============================================================================

[gcode_macro MARK_HARDWARE_VALIDATED]
description: Confirm the hardware validation checklist is complete (CONFIRM=YES)
gcode:
    {% if params.CONFIRM|default("")|upper != "YES" %}
        {action_raise_error("Run MARK_HARDWARE_VALIDATED CONFIRM=YES only after completing every step of the hardware validation checklist.")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=khaos_hw_validated VALUE=True
    RESPOND MSG="Hardware validation recorded. START_PRINT is now enabled."

[gcode_macro CLEAR_HARDWARE_VALIDATION]
description: Re-enable the START_PRINT safety gate (e.g. after hardware changes)
gcode:
    SAVE_VARIABLE VARIABLE=khaos_hw_validated VALUE=False
    RESPOND MSG="Hardware validation cleared. START_PRINT is blocked again."

[gcode_macro START_PRINT]
description: Heat, home, load mesh and purge. Params: BED_TEMP, EXTRUDER_TEMP
gcode:
    {% set validated = printer.save_variables.variables.khaos_hw_validated|default(False) %}
    {% if not validated %}
        {action_raise_error("START_PRINT blocked: hardware validation not completed. See docs/printer-setup.md, then run MARK_HARDWARE_VALIDATED CONFIRM=YES.")}
    {% endif %}
    {% set bed = params.BED_TEMP|default(60)|float %}
    {% set hotend = params.EXTRUDER_TEMP|default(200)|float %}
    {% if bed > printer.configfile.settings.heater_bed.max_temp or hotend > printer.configfile.settings.extruder.max_temp %}
        {action_raise_error("START_PRINT: requested temperature exceeds the configured max_temp")}
    {% endif %}
    CLEAR_PAUSE
    M140 S{bed}
    # Warm the nozzle below oozing temperature while the bed heats.
    M104 S{[hotend, 150]|min}
    G90
    G28
    {% if "default" in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% else %}
        RESPOND TYPE=error MSG="No saved bed mesh 'default' - run BED_MESH_CALIBRATE and SAVE_CONFIG"
    {% endif %}
    G1 Z10 F600
    M190 S{bed}
    M109 S{hotend}
    # Purge line along the left edge. VERIFY clearance on your bed.
    G92 E0
    G1 X2 Y20 Z0.3 F5000
    G1 Y200 E15 F1500
    G1 X2.4 F5000
    G1 Y20 E30 F1500
    G92 E0
    G1 Z2 F600

[gcode_macro END_PRINT]
description: Retract, park, and turn heaters and motors off
gcode:
    G91
    G1 E-2 F2700
    G1 Z10 F600
    G90
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    G1 X0 Y{max_y - 10} F6000
    TURN_OFF_HEATERS
    M107
    M84
