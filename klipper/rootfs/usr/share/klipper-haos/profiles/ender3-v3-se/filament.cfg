# =============================================================================
# Ender 3 V3 SE - filament change and purge macros (Klipper HAOS profile)
# =============================================================================
# STATUS: NOT YET VALIDATED ON HARDWARE BY THIS PROJECT.
#
#   LOAD_FILAMENT   [TEMP=<C>] [LENGTH=<mm>] [PURGE=<mm>] [SELECT_SPOOL=0|1]
#   UNLOAD_FILAMENT [TEMP=<C>] [LENGTH=<mm>] [EJECT_SPOOL=0|1]
#   PURGE           [TEMP=<C>] [LENGTH=<mm>]
#   M600            [X<mm>] [Y<mm>] [Z<mm>]   (classic syntax, no "=")
#
# Without TEMP the macros use the current nozzle target, or the default
# below when the nozzle is off. They refuse to run while a print is
# running; pause it first (M600 does that for you). The nozzle stays hot
# afterwards; idle_timeout turns it off after 30 minutes without activity.
#
# With the app option 'spoolman' on: UNLOAD_FILAMENT clears Spoolman's
# active spool when the filament is out, and LOAD_FILAMENT opens the spool
# picker in Mainsail before it heats, so you can choose the new spool while
# the nozzle warms up. Filament is only counted while a spool is active.
# EJECT_SPOOL=0 / SELECT_SPOOL=0 skip that. Without Spoolman nothing changes.
#
# Filament change during a print (slicer "Change filament G-code": M600):
#   1. M600 pauses, parks the head at least Z (default 50 mm) above the bed
#      and unloads.
#   2. Insert the new filament and run LOAD_FILAMENT (PURGE for more).
#      With Spoolman, choose the new spool in the picker that opens.
#   3. Remove the purged strand, then RESUME.
#   Finish within 30 minutes: when idle_timeout turns the motors off, the
#   printer loses its position and the print cannot be resumed.
#
# To change the defaults, copy the _KHAOS_FILAMENT_SETTINGS section below
# into /config/printer.cfg (below the profile include) and edit the values.
# =============================================================================

[gcode_macro _KHAOS_FILAMENT_SETTINGS]
description: Defaults for the filament macros (override in printer.cfg)
# Nozzle temperature when TEMP is not given and the nozzle is off.
variable_temp: 220
# VERIFY: distance from the extruder gears to the nozzle on your printer.
variable_load_length: 40
variable_load_speed: 5
# Extruded after loading, until the new colour comes out clean.
variable_purge_length: 30
variable_purge_speed: 2.5
# Enough to pull the filament tip out of the extruder gears.
variable_unload_length: 50
variable_unload_speed: 10
# PURGE first raises a homed nozzle to at least this height.
variable_purge_min_z: 10
# M600 parks the nozzle at least this high above the bed.
variable_park_z: 50
gcode:
    RESPOND MSG="_KHAOS_FILAMENT_SETTINGS only holds settings."

[gcode_macro _KHAOS_FILAMENT_HEAT]
description: Helper: refuse during a running print, then heat for a filament move
gcode:
    {% set name = params.NAME|default("Filament macro") %}
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        {action_raise_error(name ~ ": not allowed while a print is running. Pause first, or use M600.")}
    {% endif %}
    {% set cfg = printer.configfile.settings.extruder %}
    {% set target = printer.extruder.target|float %}
    {% set temp = params.TEMP|default(0)|float %}
    {% if temp <= 0 %}
        {% set temp = target if target >= cfg.min_extrude_temp
                 else printer["gcode_macro _KHAOS_FILAMENT_SETTINGS"].temp|float %}
    {% endif %}
    {% if temp < cfg.min_extrude_temp or temp > cfg.max_temp %}
        {action_raise_error("%s: TEMP must be between %d and %d" % (name, cfg.min_extrude_temp, cfg.max_temp))}
    {% endif %}
    M109 S{temp}

[gcode_macro _KHAOS_FILAMENT_MOVE]
description: Helper: relative extruder-only move with a length check
gcode:
    {% set length = params.LENGTH|float %}
    {% set speed = params.SPEED|float %}
    {% set limit = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
    {% if length|abs > limit %}
        {action_raise_error("Filament move of %.1f mm exceeds max_extrude_only_distance (%.1f mm)" % (length|abs, limit))}
    {% endif %}
    {% if speed <= 0 %}
        {action_raise_error("Filament move speed must be positive")}
    {% endif %}
    M83
    G1 E{length} F{speed * 60}

[gcode_macro UNLOAD_FILAMENT]
description: Heat and pull the filament out of the extruder. Params: TEMP, LENGTH, EJECT_SPOOL
gcode:
    {% set s = printer["gcode_macro _KHAOS_FILAMENT_SETTINGS"] %}
    {% set length = params.LENGTH|default(s.unload_length)|float|abs %}
    _KHAOS_FILAMENT_HEAT NAME=UNLOAD_FILAMENT TEMP={params.TEMP|default(0)}
    SAVE_GCODE_STATE NAME=khaos_filament
    # Push a little first so the tip is soft, then pull quickly to break it
    # off cleanly, then pull the rest of the way out of the gears.
    _KHAOS_FILAMENT_MOVE LENGTH=5 SPEED=3
    _KHAOS_FILAMENT_MOVE LENGTH=-10 SPEED=40
    _KHAOS_FILAMENT_MOVE LENGTH=-{length} SPEED={s.unload_speed}
    RESTORE_GCODE_STATE NAME=khaos_filament
    M400
    RESPOND MSG="Filament unloaded: pull it out of the extruder. The nozzle stays hot (M104 S0 cools it)."
    {% if params.EJECT_SPOOL|default(1)|int and "gcode_macro _KHAOS_SPOOLMAN_EJECT" in printer %}
        _KHAOS_SPOOLMAN_EJECT
    {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat, feed new filament to the nozzle and purge. Params: TEMP, LENGTH, PURGE, SELECT_SPOOL
gcode:
    {% set s = printer["gcode_macro _KHAOS_FILAMENT_SETTINGS"] %}
    {% set length = params.LENGTH|default(s.load_length)|float|abs %}
    {% set purge = params.PURGE|default(s.purge_length)|float|abs %}
    {% if params.SELECT_SPOOL|default(1)|int and "gcode_macro _KHAOS_SPOOLMAN_SELECT" in printer %}
        _KHAOS_SPOOLMAN_SELECT
    {% endif %}
    _KHAOS_FILAMENT_HEAT NAME=LOAD_FILAMENT TEMP={params.TEMP|default(0)}
    SAVE_GCODE_STATE NAME=khaos_filament
    _KHAOS_FILAMENT_MOVE LENGTH={length} SPEED={s.load_speed}
    {% if purge > 0 %}
        _KHAOS_FILAMENT_MOVE LENGTH={purge} SPEED={s.purge_speed}
    {% endif %}
    # Small retraction against oozing; RESUME pushes it back.
    _KHAOS_FILAMENT_MOVE LENGTH=-1 SPEED=35
    RESTORE_GCODE_STATE NAME=khaos_filament
    M400
    RESPOND MSG="Filament loaded. If the old colour still shows, run PURGE."

[gcode_macro PURGE]
description: Heat and extrude filament to clean out the nozzle. Params: TEMP, LENGTH
gcode:
    {% set s = printer["gcode_macro _KHAOS_FILAMENT_SETTINGS"] %}
    {% set length = params.LENGTH|default(s.purge_length)|float|abs %}
    {% set min_z = s.purge_min_z|float %}
    {% set z_homed = "z" in printer.toolhead.homed_axes %}
    _KHAOS_FILAMENT_HEAT NAME=PURGE TEMP={params.TEMP|default(0)}
    SAVE_GCODE_STATE NAME=khaos_filament
    {% if z_homed and printer.toolhead.position.z < min_z %}
        G90
        G1 Z{min_z} F600
    {% elif not z_homed %}
        RESPOND TYPE=error MSG="PURGE: Z is not homed. Make sure the nozzle is well above the bed."
    {% endif %}
    _KHAOS_FILAMENT_MOVE LENGTH={length} SPEED={s.purge_speed}
    _KHAOS_FILAMENT_MOVE LENGTH=-1 SPEED=35
    RESTORE_GCODE_STATE NAME=khaos_filament
    M400
    RESPOND MSG="Purge done. Remove the purged strand before printing."

[gcode_macro M600]
description: Filament change: pause, park and unload. Then LOAD_FILAMENT and RESUME
gcode:
    # M600 is a classic G-code command: parameters are written X10 Y10 Z60
    # (no "="). A value that is not a number is refused, not ignored.
    {% set s = printer["gcode_macro _KHAOS_FILAMENT_SETTINGS"] %}
    {% set z_min = params.Z|default(s.park_z)|float(none) %}
    {% set x = params.X|default(0)|float(none) %}
    {% set y = params.Y|default(0)|float(none) %}
    {% if z_min is none or z_min < 0 or x is none or y is none %}
        {action_raise_error("M600: use numbers, for example M600 X10 Y10 Z60")}
    {% endif %}
    {% set xy = ("X=%s " % x if params.X is defined else "") ~ ("Y=%s" % y if params.Y is defined else "") %}
    {% if not printer.pause_resume.is_paused %}
        PAUSE Z_MIN={z_min} {xy}
    {% endif %}
    UNLOAD_FILAMENT
    RESPOND MSG="Filament change: insert the new filament, run LOAD_FILAMENT, remove the purged strand, then RESUME."
