# =============================================================================
# Creality Ender 3 V3 SE - Klipper HAOS printer profile
# =============================================================================
# STATUS: EXPERIMENTAL - NOT YET VALIDATED ON HARDWARE BY THIS PROJECT.
#
# Target board: Creality CR4NS200320C13 (GD32F303RET6 MCU), stock wiring,
# stock CR Touch, Sprite direct-drive extruder, stock hotend and bed.
# Board revisions differ (e.g. stepper driver chips). Check yours first:
# see docs/printer-setup.md in the project repository.
#
# MCU firmware: "make menuconfig" -> STM32F103, 28KiB bootloader,
# serial (on USART1 PA10/PA9), 250000 baud. A matching configuration is in
# firmware/ender3-v3-se/klipper.config in the project repository.
#
# Pin assignments were cross-checked against two independent community
# configurations (references in docs/printer-setup.md); they agree, but
# community data is not a guarantee. Values marked VERIFY must be checked or
# calibrated on your printer before the first print.
#
# How to use: make your /config/printer.cfg contain
#     [include klipper-haos/generated.cfg]
#     [include profiles/ender3-v3-se/printer.cfg]
# and put your own overrides below those lines. This copy is yours; app
# updates never overwrite it. The pristine version shipped with the app is
# in klipper-haos/dist/profiles/ender3-v3-se/ for comparison.
# =============================================================================

[include drivers-tmc2208.cfg]
[include macros.cfg]

[mcu]
# The serial port comes from the app option 'serial_device'.
restart_method: command

[printer]
kinematics: cartesian
# Conservative limits for first operation. The stock firmware allows more;
# raise them only after input shaper tuning.
max_velocity: 200
max_accel: 2000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
# VERIFY with QUERY_ENDSTOPS: must read "open" when released and
# "TRIGGERED" when pressed by hand. If inverted, toggle the "!".
endstop_pin: !PA5
position_endstop: -6
position_min: -6
position_max: 230
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
# VERIFY with QUERY_ENDSTOPS (see stepper_x).
endstop_pin: !PA6
position_endstop: -14
position_min: -14
position_max: 230
homing_speed: 50

[stepper_z]
# The two Z motors are driven in parallel by one driver.
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
# VERIFY: calibrate rotation_distance (extrude 100 mm and measure).
rotation_distance: 7.44
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100.0
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
# VERIFY: community starting values. Run
#   PID_CALIBRATE HEATER=extruder TARGET=210
# then SAVE_CONFIG before printing.
pid_Kp: 27.142
pid_Ki: 1.371
pid_Kd: 134.351
min_temp: 0
max_temp: 260
min_extrude_temp: 170
pressure_advance: 0.0

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
# VERIFY: community starting values. Run
#   PID_CALIBRATE HEATER=heater_bed TARGET=60
# then SAVE_CONFIG before printing.
pid_Kp: 66.371
pid_Ki: 0.846
pid_Kd: 1301.702
min_temp: 0
max_temp: 100

# Klipper's heater verification (thermal runaway protection) is active for
# every heater by default. The explicit sections document the values in use;
# do not loosen them.
[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

[heater_fan hotend_fan]
pin: PC1
heater: extruder
heater_temp: 50.0

[fan]
# Part cooling fan.
pin: PA0

[bltouch]
# CR Touch.
sensor_pin: ^PC14
control_pin: PC13
# VERIFY: measure the probe offsets on your printer. The two community
# references differ slightly (-23/-14.5 and -24/-13).
x_offset: -23.0
y_offset: -14.5
# SAFETY: 0.0 deliberately leaves the nozzle ABOVE the bed. Calibrate with
#   G28
#   PROBE_CALIBRATE
# (paper test), then ACCEPT and SAVE_CONFIG.
z_offset: 0.0
speed: 5
samples: 2
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 2
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True

[safe_z_home]
# Nozzle position for Z homing (probe lands near the bed centre).
home_xy_position: 134, 123
speed: 80
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 100
horizontal_move_z: 5
# Probe coordinates. Max = axis max + probe offset (230-23, 230-14.5).
mesh_min: 30, 30
mesh_max: 207, 215.5
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

[screws_tilt_adjust]
# VERIFY: probe positions above the four bed screws.
screw1: 54.5, 45.5
screw1_name: front left screw
screw2: 224.5, 45.5
screw2_name: front right screw
screw3: 224.5, 215.5
screw3_name: rear right screw
screw4: 54.5, 215.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 50
screw_thread: CCW-M4

[output_pin beeper]
pin: PB0

[input_shaper]
# Disabled until tuned (ringing tower test, see Klipper docs
# Resonance_Compensation.md). Set shaper_freq_x/y after measuring.
shaper_type: mzv
shaper_freq_x: 0
shaper_freq_y: 0

[exclude_object]

[idle_timeout]
# Turn heaters and motors off after 30 minutes without activity.
timeout: 1800

[save_variables]
filename: /config/klipper-haos-variables.cfg
