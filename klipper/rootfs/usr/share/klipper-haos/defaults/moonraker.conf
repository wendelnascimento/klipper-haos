# =============================================================================
# Klipper HAOS - moonraker.conf
# =============================================================================
# Created by the app because no moonraker.conf existed. It is yours: the app
# never overwrites it.
#
# The include below contains the settings the app needs to work (listen
# address, Klipper socket, trusted ingress proxy, ...). It is regenerated at
# every start from the app options. Keep it as the first line. Settings you
# add below override it, so do not change [server] host/port or the
# [authorization] trusted_clients unless you understand the security impact
# (see the app documentation, "Security").
#
# Moonraker's update manager is intentionally not enabled: component
# versions are pinned by the app release and updated through Home Assistant.
# =============================================================================
[include klipper-haos/moonraker-generated.conf]

# Example: notify on print events (https://moonraker.readthedocs.io).
# [notifier print_done]
# url: ...
