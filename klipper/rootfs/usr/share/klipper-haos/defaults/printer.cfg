# =============================================================================
# Klipper HAOS - starter printer.cfg
# =============================================================================
# This file was created by the app because no printer.cfg existed. It is
# yours: the app never overwrites it.
#
# This starter configuration is intentionally INERT. It connects to the
# printer's MCU (once the controller runs Klipper firmware) but defines no
# steppers, heaters or fans, so nothing can move or heat up. Use it to
# confirm that Klipper can talk to the printer before loading a real profile.
#
# Next steps:
#   1. Flash Klipper firmware to the printer (see the app documentation).
#   2. Select the printer's serial device in the app's Configuration tab.
#   3. Restart the app and confirm Mainsail shows "Klipper ready".
#   4. Replace the [printer] section below with a printer profile, e.g.
#        [include profiles/ender3-v3-se/printer.cfg]
#      and work through the hardware validation checklist BEFORE printing.
# =============================================================================

# Managed by the app (serial device, G-code folder, Mainsail macros).
# Keep this line at the very top.
[include klipper-haos/generated.cfg]

[mcu]
# The serial port comes from the app option 'serial_device'.
# Add MCU-specific options (e.g. restart_method) here if your board needs them.

[printer]
kinematics: none
max_velocity: 1
max_accel: 1
