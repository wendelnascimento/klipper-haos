configuration:
  serial_device:
    name: Printer serial device
    description: >-
      Serial port of the printer controller. Prefer the /dev/serial/by-id/...
      entry, which survives reboots and re-plugging. Leave empty until the
      printer runs Klipper firmware.
  log_level:
    name: Log level
    description: Verbosity of the app's own startup and supervision messages.
  trusted_networks:
    name: Trusted networks (direct port)
    description: >-
      CIDR ranges (for example 192.168.1.50/32) that may use the direct port
      without an API key. Leave empty to require an API key for every client.
      The Home Assistant internal network and catch-all ranges are rejected.
  cors_domains:
    name: CORS origins
    description: >-
      Extra web origins allowed to call Moonraker from a browser, for example
      http://my-other-mainsail.local. Not needed for the built-in Mainsail.
  export_api_key:
    name: Export Moonraker API key
    description: >-
      Write the Moonraker API key to moonraker.apikey in the app config
      folder so you can paste it into a slicer. Turn it off again afterwards.
  spoolman:
    name: Spoolman (filament inventory)
    description: >-
      Run the bundled Spoolman so Moonraker tracks how much filament is left
      on each spool. Open its web UI from Mainsail's Spoolman panel; it is
      only reachable through Home Assistant. Uses up to about 90 MB more memory.
  numpy:
    name: numpy (accelerometer input shaper calibration)
    description: >-
      Let Klipper use numpy, which SHAPER_CALIBRATE and TEST_RESONANCES need.
      Klipper loads it only when a resonance test runs (about 22 MB more
      memory from then until Klipper restarts). Leave off if you do not use
      an accelerometer.
  adxl_serial_device:
    name: Accelerometer serial device
    description: >-
      Serial port of a USB accelerometer board running Klipper (for example
      an RP2040 ADXL345 board), added as [mcu adxl]. Use its
      /dev/serial/by-id/usb-Klipper_rp2040_... entry. Clear it when the board
      is unplugged: Klipper waits for every configured MCU at start-up.
network:
  7125/tcp: Mainsail and Moonraker API for slicers and external clients
